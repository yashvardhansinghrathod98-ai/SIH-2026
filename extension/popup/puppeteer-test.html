<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Face Detector Browser Test</title>
</head>
<body>
  <canvas id="test-canvas"></canvas>
  
  <script src="../lib/onnx/ort.all.min.js"></script>
  <script src="../perception/canvas-processor.js"></script>
  <script src="../perception/yolo-face-detector.js"></script>
  
  <script>
    async function runFaceTest(imageUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = async () => {
          try {
            const canvas = document.getElementById("test-canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            
            // Run exactly as popup.js does
            const result = await YOLOFaceDetectorModule.detectFaces(canvas, 0.45, 0.45);
            resolve({
              success: true,
              faceCount: result.detections.length,
              detections: result.detections,
              metrics: result.metrics
            });
          } catch (e) {
            reject(e.toString());
          }
        };
        img.onerror = () => reject("Failed to load image: " + imageUrl);
        img.src = imageUrl;
      });
    }
    
    // Expose to Puppeteer
    window.runFaceTest = runFaceTest;
  </script>
</body>
</html>
